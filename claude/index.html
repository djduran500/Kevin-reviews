<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">

<style>
:root{--bg:#07020f;--p1:#1b0736;--p2:#2d0b57;--acc:#b98cff;--txt:#efe6ff;--mut:#a996c9}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg) linear-gradient(170deg,#000 0%,var(--p1) 45%,var(--p2) 100%) fixed;min-height:100vh}
header{text-align:center;padding:64px 16px 28px}
h1{margin:0;font-size:clamp(34px,6vw,60px);letter-spacing:-.02em;font-weight:800;background:linear-gradient(90deg,#fff,var(--acc));-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--mut);margin:12px 0 0;font-size:17px}
.bar{position:sticky;top:0;z-index:5;background:rgba(7,2,15,.82);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid rgba(185,140,255,.18);padding:10px 16px}
.bar .in{max-width:980px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center}
.bar button,.bar a{font:inherit;font-size:13px;color:var(--txt);background:rgba(185,140,255,.10);border:1px solid rgba(185,140,255,.25);border-radius:999px;padding:5px 12px;cursor:pointer;text-decoration:none}
.bar button.on{background:var(--acc);color:#14052b;border-color:var(--acc)}
.bar b{opacity:.7;font-weight:600}.yrs{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;width:100%}.yrs a{padding:3px 9px;font-size:12px}
main{max-width:980px;margin:0 auto;padding:12px 16px 80px}
.yr{display:flex;align-items:baseline;gap:12px;margin:48px 0 18px;font-size:30px;font-weight:800;color:#fff;scroll-margin-top:110px}
.yr small{font-size:14px;color:var(--mut);font-weight:500}.yr::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,rgba(185,140,255,.5),transparent)}
.c{margin:0 0 22px;background:rgba(255,255,255,.04);border:1px solid rgba(185,140,255,.16);border-radius:16px;padding:10px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.c img{display:block;width:100%;height:auto;border-radius:10px;background:#fff}
figcaption{display:flex;justify-content:space-between;align-items:center;padding:2px 4px 9px;font-size:13px;color:var(--mut)}
.b{font-weight:700;font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px;border-radius:999px;color:#fff}
.b-Knot{background:#6d28d9}.b-WeddingWire{background:#7e22ce}.b-Zola{background:#9333ea}.b-Google{background:#5b21b6}
.hide{display:none}footer{text-align:center;color:var(--mut);font-size:13px;padding:0 16px 40px}
@media print{.bar{display:none}body{-webkit-print-color-adjust:exact;print-color-adjust:exact}.c{break-inside:avoid}}
</style></head><body>

<script>
document.querySelectorAll('.bar button').forEach(b=>b.onclick=()=>{const f=b.dataset.f;document.querySelectorAll('.bar button').forEach(x=>x.classList.toggle('on',x===b));
